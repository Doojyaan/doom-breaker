<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="doom-breaker logo">
  <!-- doom-breaker mark "Open Switch" (user-selected final): a healthy circuit trace
       broken by an open switch arm, spark filling the gap.
       Green = healthy flow · red = tripped arm · yellow = the doom it stops. -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#0D1117" stroke="#21262D" stroke-width="4"/>
  <g transform="translate(0,-6)">
    <path d="M36 150 H96" stroke="#2BA640" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="36" cy="150" r="14" fill="#2BA640"/>
    <circle cx="96" cy="150" r="11" fill="#9BE7A4"/>
    <path d="M160 150 L216 86" stroke="#E5484D" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="160" cy="150" r="11" fill="#E5484D"/>
    <circle cx="216" cy="86" r="14" fill="#E5484D"/>
    <path d="M138 96 L112 150 L130 150 L118 204 L146 146 L128 146 Z"
          fill="#F5A623" stroke="#F5A623" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
